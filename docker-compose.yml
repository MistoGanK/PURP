services:
  # Servidor de Base de Datos
  db:
    image: mariadb:10.11
    container_name: purp_db
    restart: always
    ports:
     - "3306:3306"
    environment:
      MYSQL_DATABASE: purpdb
      MYSQL_ROOT_PASSWORD: purp2077
      MYSQL_USER: purp_dev
      MYSQL_PASSWORD: purp2077
    volumes:
      - db_data:/var/lib/mysql

  # El Servidor de Aplicación (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purp_app
    volumes:
      - .:/var/www
    depends_on:
      - db

  # Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: purp_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:z
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

  # Tailwind Script
  tailwind:
    image: node:20-alpine
    container_name: purp_tailwind
    working_dir: /src
    tty: true
    stdin_open: true
    volumes:
     - .:/src:z
     - /src/node_modules
    # Comando
    command: >
     sh -c "npm install && ./node_modules/.bin/tailwindcss -i ./public/assets/tailwind/main.css -o ./public/assets/tailwind/mainOutput.css --watch --poll"     

volumes:
  db_data:
